services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-sqlite:////data/governance.db}
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - governance-data:/data
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:5173:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  governance-data:
