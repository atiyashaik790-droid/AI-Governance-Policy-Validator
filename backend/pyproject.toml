[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Standalone scripts add backend/ to sys.path before importing application modules.
[tool.ruff.lint.per-file-ignores]
"../scripts/check_azure_sql.py" = ["E402"]
"../scripts/check_live_connectivity.py" = ["E402"]
"../scripts/inventory_azure_sql.py" = ["E402"]
"../scripts/test_azure_sql_writes.py" = ["E402"]
