name: Local application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_docker_demo.py --output docker-demo-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-demo-verification
          path: docker-demo-verification.json
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: cd backend && pytest -q && ruff check . && ruff format --check .
      - run: ruff check scripts && ruff format --check scripts
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .ci-venv
      - run: .ci-venv/bin/pip install -r backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && GOVERNANCE_TEST_PYTHON="$GITHUB_WORKSPACE/.ci-venv/bin/python" npm test && npm run build && npm audit --audit-level=high
        working-directory: frontend
